<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>{{TITLE}} · stream-thing sync</title>
<style>
  :root { --bg: #0e0f13; --panel: #171920; --line: #2a2e3a; --text: #e8e9ee; --muted: #9096a6; --accent: #7c8cff; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); }
  body { font: 15px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; padding: 24px 16px 48px; }
  main { max-width: 560px; margin: 0 auto; }
  header { margin-bottom: 20px; }
  h1 { font-size: 20px; margin: 0; letter-spacing: -0.01em; }
  h1 a { color: inherit; text-decoration: none; }
  h1 span { color: var(--accent); }
  h2 { font-size: 18px; margin: 0 0 4px; }
  h3 { font-size: 15px; margin: 18px 0 6px; }
  p, ul { margin: 0 0 10px; }
  ul { padding-left: 20px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 18px; }
  .muted { color: var(--muted); font-size: 13px; }
  a { color: var(--accent); }
  footer { margin-top: 20px; font-size: 13px; color: var(--muted); text-align: center; }
</style>
</head>
<body>
<main>
  <header><h1><a href="/">stream-thing <span>sync</span></a></h1></header>
  <article class="card">
{{BODY}}
  </article>
  <footer><a href="/">Home</a> · <a href="/privacy">Privacy</a> · <a href="/terms">Terms</a></footer>
</main>
</body>
</html>
