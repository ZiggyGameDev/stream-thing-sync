<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Sign in your TV · stream-thing</title>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #110b0c; color: #f3ebe6; font: 16px system-ui, sans-serif; }
  main { width: min(380px, calc(100% - 32px)); }
  h1 { font-size: 24px; margin: 0 0 8px; }
  p { color: #c9bdb8; line-height: 1.45; }
  input { width: 100%; box-sizing: border-box; padding: 14px; margin: 8px 0 18px; border-radius: 10px; border: 1px solid #ffffff33;
          background: #000; color: #fff; font: 20px ui-monospace, monospace; letter-spacing: .15em; text-transform: uppercase; text-align: center; }
  #msg { margin-top: 16px; min-height: 1.4em; }
  .ok { color: #7dd87d; } .err { color: #ff7a7a; }
</style>
</head>
<body>
<main>
  <h1>Sign in your TV</h1>
  <p>Check this code matches the one on your TV, then sign in with Google.</p>
  <input id="code" value="{{CODE}}" placeholder="ABCD-EFGH" autocomplete="off" autocapitalize="characters" spellcheck="false" aria-label="The code on your TV">
  <div id="button"></div>
  <p id="msg" role="status"></p>
</main>
<script nonce="{{NONCE}}" src="https://accounts.google.com/gsi/client"></script>
<script nonce="{{NONCE}}">
  const msg = document.getElementById('msg');
  async function done(response) {
    msg.className = '';
    msg.textContent = 'Signing your TV in…';
    try {
      const res = await fetch('/api/auth/tv/approve', {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ user_code: document.getElementById('code').value, id_token: response.credential }),
      });
      const body = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(body.error || 'Something went wrong.');
      msg.className = 'ok';
      msg.textContent = 'Done. ' + (body.device_name || 'Your TV') + ' is signing in now.';
    } catch (e) {
      msg.className = 'err';
      msg.textContent = e.message;
    }
  }
  function ready() {
    google.accounts.id.initialize({ client_id: {{CLIENT_ID_JSON}}, callback: done, auto_select: false });
    google.accounts.id.renderButton(document.getElementById('button'), { type: 'standard', size: 'large', text: 'continue_with', theme: 'filled_black' });
  }
  if (window.google && google.accounts) ready();
  else window.addEventListener('load', ready);
</script>
</body>
</html>
